name: Publish prototype to GitHub Pages

# Copies the built prototype (.claude-project/design/prototype + assets) to the gh-pages branch.
# GitHub Pages serves that branch at https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
    paths:
      - '.claude-project/design/prototype/**'
      - '.claude-project/design/assets/**'
      - '.claude-project/design/_build/final/pages-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: bash .claude-project/design/_build/final/pages-site.sh "$RUNNER_TEMP/site"

      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish prototype from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
